<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradient definitions -->
        <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>

        <!-- Filter for glow effect -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background circle with subtle glow -->
    <circle cx="30" cy="30" r="26" fill="url(#primaryGradient)" opacity="0.1" filter="url(#glow)"/>

    <!-- Main logo container -->
    <g transform="translate(4, 4)">
        <!-- Outer ring -->
        <circle cx="26" cy="26" r="24" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3"/>

        <!-- Inner design elements -->
        <circle cx="26" cy="26" r="20" fill="url(#primaryGradient)" opacity="0.8"/>

        <!-- Tech-inspired geometric elements -->
        <polygon points="16,16 36,16 32,20 20,20" fill="rgba(255,255,255,0.2)"/>
        <polygon points="20,32 32,32 36,36 16,36" fill="rgba(255,255,255,0.2)"/>

        <!-- Central IR letters -->
        <text x="26" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">IR</text>
    </g>

    <!-- Company name -->
    <text x="65" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#primaryGradient)">Indranil</text>
    <text x="65" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#accentGradient)">Roy</text>

    <!-- Subtle tech elements -->
    <circle cx="180" cy="15" r="8" fill="url(#primaryGradient)" opacity="0.6"/>
    <circle cx="190" cy="20" r="6" fill="url(#accentGradient)" opacity="0.4"/>
    <rect x="175" y="40" width="30" height="1" fill="url(#primaryGradient)" opacity="0.3" rx="0.5"/>
</svg>